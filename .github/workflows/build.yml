name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject Cloudflare email-obfuscation artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Cloudflare rewrites emails at serve time. If these markers appear in
          # committed HTML, the page was rebuilt from a scrape of the live site
          # and its email links are broken. See DEPLOY.md.
          if grep -rn --include='*.html' -e 'cdn-cgi/l/email-protection' -e '__cf_email__' -e 'email-decode.min.js' .; then
            echo "::error::Cloudflare email-obfuscation artifacts found in committed HTML. Restore the real mailto: links before merging."
            exit 1
          fi
          echo "No Cloudflare email-obfuscation artifacts found."

      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            if [[ -f pnpm-lock.yaml ]]; then
              corepack enable
              pnpm install --frozen-lockfile
              pnpm run build --if-present
            elif [[ -f package-lock.json ]]; then
              npm ci
              npm run build --if-present
            else
              npm install
              npm run build --if-present
            fi
          elif [[ -f index.html ]]; then
            python3 -c 'from pathlib import Path; page = Path("index.html").read_text(encoding="utf-8"); assert "<html" in page.lower() and "</html>" in page.lower(); print("Static site markup check passed.")'
          else
            echo "No application build manifest is present yet; checkout verified."
          fi
